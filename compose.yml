services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rede_solidaria_pet
      POSTGRES_USER: rede_solidaria_pet
      POSTGRES_PASSWORD: rede_solidaria_pet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rede_solidaria_pet -d rede_solidaria_pet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://rede_solidaria_pet:rede_solidaria_pet@db:5432/rede_solidaria_pet
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres-data:
