name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: URL pública HTTPS do frontend
        required: true
        type: string
      backend_url:
        description: URL pública HTTPS do backend
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Smoke public URLs
        env:
          # No dispatch manual usa os inputs; no agendamento usa as variáveis do
          # repositório (Settings > Variables), com defaults de produção.
          FRONTEND_PUBLIC_URL: >-
            ${{ inputs.frontend_url
              || vars.FRONTEND_PUBLIC_URL
              || 'https://rede-solidaria-pet.vercel.app' }}
          BACKEND_PUBLIC_URL: >-
            ${{ inputs.backend_url
              || vars.BACKEND_PUBLIC_URL
              || 'https://rede-solidaria-pet-api.onrender.com' }}
        run: node scripts/smoke-production.mjs
