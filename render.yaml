services:
  - type: web
    name: rede-solidaria-pet-api
    plan: free
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: rede-solidaria-pet-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: rede-solidaria-pet-db
    plan: free
    databaseName: rede_solidaria_pet
    user: rede_solidaria_pet
