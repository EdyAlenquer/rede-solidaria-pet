services:
  - type: web
    name: rede-solidaria-pet-api
    plan: free
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Readiness (/ready) confirma que o app responde E que o banco está de pé
    # (SELECT 1) antes de o Render rotear tráfego para a instância.
    healthCheckPath: /ready
    autoDeploy: true
    # Aplica as migrações UMA vez antes de promover a nova versão. ATENÇÃO:
    # o preDeployCommand só roda em planos PAGOS; no free tier ele é ignorado,
    # por isso o Dockerfile também aplica `alembic upgrade head` no start do
    # container (idempotente). Ao migrar para um plano pago, este passo passa a
    # rodar as migrações antes do deploy e o start vira no-op.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: rede-solidaria-pet-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://rede-solidaria-pet.vercel.app
      # Chave de assinatura JWT gerada pelo Render (nunca versionada). Em
      # produção o app recusa subir com a SECRET_KEY default insegura.
      - key: SECRET_KEY
        generateValue: true
      # Workers do Uvicorn; ajuste conforme as CPUs do plano. Default 2 no
      # Dockerfile já é razoável para o free tier.
      - key: WEB_CONCURRENCY
        value: "2"
      # --- Opcionais (descomente/configure conforme necessário) ---
      # Notificações por e-mail (default "log", que apenas registra no logging):
      #   NOTIFIER_BACKEND=smtp e os SMTP_* abaixo habilitam envio real.
      # - key: NOTIFIER_BACKEND
      #   value: smtp
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: SMTP_FROM
      #   sync: false
      # Storage das imagens enviadas. O default "local" grava em disco EFÊMERO
      # no Render free: as fotos somem a cada deploy/restart. Em produção, use
      # object storage S3-compatível (Cloudflare R2) — veja docs/deploy.md.
      # Configure STORAGE_BACKEND=s3 e os S3_* abaixo no DASHBOARD do Render
      # (sync: false = segredo, definido na UI; NUNCA versione valores reais).
      # - key: STORAGE_BACKEND
      #   value: s3
      # - key: S3_BUCKET
      #   sync: false
      # - key: S3_ENDPOINT_URL        # R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      #   sync: false
      # - key: S3_REGION              # "auto" no R2; região real na AWS
      #   value: auto
      # - key: S3_ACCESS_KEY_ID
      #   sync: false
      # - key: S3_SECRET_ACCESS_KEY
      #   sync: false
      # - key: S3_PUBLIC_BASE_URL     # R2: https://pub-<HASH>.r2.dev ou domínio próprio
      #   sync: false
      # - key: S3_PREFIX
      #   value: pedidos
      # Storage local (default; só relevante quando STORAGE_BACKEND=local):
      # - key: UPLOAD_DIR
      #   value: uploads
      # - key: PUBLIC_UPLOAD_PATH
      #   value: /uploads
      # - key: MAX_UPLOAD_BYTES
      #   value: "5242880"

databases:
  - name: rede-solidaria-pet-db
    plan: free
    databaseName: rede_solidaria_pet
    user: rede_solidaria_pet
